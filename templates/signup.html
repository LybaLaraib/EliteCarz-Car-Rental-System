{# New user registration page. #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Signup</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <form class="auth-modal signup-card" method="POST">
    <h2>Create Account</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <div class="signup-grid">
      <input name="name" placeholder="Full Name" required>
      <input name="username" placeholder="Username" required>
      <input name="email" type="email" placeholder="Email" required>
      <div class="password-wrap">
        <input id="signupPassword" name="password" type="password" placeholder="Password" required>
        <button type="button" class="tiny-btn" onclick="togglePassword('signupPassword')">Show</button>
      </div>
      <input name="phone" placeholder="Phone Number" required>
      <input name="address" placeholder="Address" required>
      <input name="security_question" placeholder="Security Question" required>
      <input name="security_answer" placeholder="Security Answer" required>
    </div>
    <button class="btn" type="submit">Signup</button>
    <div class="auth-links">
      <a href="/login">Already have account?</a>
      <a href="/auth">Back</a>
    </div>
  </form>
  <div style="position:fixed; left:0; right:0; bottom:0; padding:12px 16px; text-align:center; color:rgba(148,163,184,.95); font-size:12px;">
    EliteCarz © — Secure rentals, premium experience.
  </div>
  <script src="/static/js/script.js"></script>
</body>
</html>
