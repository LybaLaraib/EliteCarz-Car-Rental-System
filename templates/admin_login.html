{# Admin sign-in page. #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <form class="auth-modal" method="POST">
    <h2>Admin Sign In</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <input name="username" placeholder="admin" required>
    <input id="adminPassword" name="password" type="password" placeholder="Password" required>
    <button type="button" class="tiny-btn" onclick="togglePassword('adminPassword')">Show</button>
    <button class="btn" type="submit">Login as Admin</button>
    <div class="auth-links"><a href="/auth">Back</a></div>
  </form>
  <div style="position:fixed; left:0; right:0; bottom:0; padding:12px 16px; text-align:center; color:rgba(148,163,184,.95); font-size:12px;">
    EliteCarz © — Secure rentals, premium experience.
  </div>
  <script src="/static/js/script.js"></script>
</body>
</html>
