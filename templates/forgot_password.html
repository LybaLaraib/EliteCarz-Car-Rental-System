{# User password reset page using the saved security answer. #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <form class="auth-modal" method="POST">
    <h2>Reset Password</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <input name="username" placeholder="Username" required>
    <input name="security_answer" placeholder="Security Answer" required>
    <input id="newPassword" name="new_password" type="password" placeholder="New Password" required>
    <button type="button" class="tiny-btn" onclick="togglePassword('newPassword')">Show</button>
    <button class="btn" type="submit">Update Password</button>
    <div class="auth-links"><a href="/login">Back to login</a></div>
  </form>
  <script src="/static/js/script.js"></script>
</body>
</html>
